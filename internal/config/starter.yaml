# kelpie config, layered over the built-in default of the kelpie binary that
# runs: state only what you change, and everything else follows the default
# as kelpie updates it. `kelpie config show` prints the config in effect.
#
# - Settings merge key by key; a list (rules.ignore_actors,
#   delivery.notify.kinds) replaces the default's list.
# - A source with a provider source's name replaces that source whole; a new
#   name adds one. `- {name: github-inbox-org, enabled: false}` switches a
#   provider's source off.
# - defs are added after the providers' jq definitions.
#
# Restart the daemon after editing; kelpie reads this file only at start.

# Integrations in their own binaries, by the command to run: kelpie runs
# only the ones listed here, never other kelpie-* it finds. GitHub uses gh's
# own login; Linear needs `kelpie auth login linear`.
providers:
  github: {command: [kelpie-github]}
  # linear: {command: [kelpie-linear]}

# hosts:
#   herdr:
#     enabled: true
#   orca:              # the Orca app
#     enabled: true
#   hc:                # herdr-core, behind the Herdr desktop app
#     enabled: true
#   myhost:            # an external host binary (see docs/hosts.md)
#     command: [kelpie-host-myhost]

# delivery:
#   debounce: 30s

# rules:
