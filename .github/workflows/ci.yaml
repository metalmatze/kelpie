name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofumpt
        run: |
          files=$(go run mvdan.cc/gofumpt@v0.12.0 -l .)
          if [ -n "$files" ]; then
            echo "Not formatted with gofumpt:"
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
